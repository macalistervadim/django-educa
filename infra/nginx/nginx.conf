# Базовые настройки для обработки соединений
events {
    # Максимальное число одновременных соединений на одного воркера.
    worker_connections 1024;
}

http {
    ######################################################################
    # Общие настройки HTTP
    ######################################################################
    
    # Подключение файла с типами MIME (например, .jpg → image/jpeg)
    include       /etc/nginx/mime.types;
    # Тип, который будет использоваться по умолчанию, если тип файла не распознан
    default_type  application/octet-stream;

    # Оптимизация передачи файлов с помощью zero-copy (sendfile)
    sendfile        on;
    # tcp_nopush помогает отправлять пакеты корректно, снижая задержки при передаче больших файлов
    tcp_nopush      on;
    # Время ожидания keepalive соединений (в секундах)
    keepalive_timeout 65;
    
    # Включение gzip-сжатия для уменьшения объёма передаваемых данных (опция для оптимизации)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_disable "msie6";

    ######################################################################
    # Определение upstream'ов (названия для бэкендов/сервисов)
    ######################################################################
    
    # Определяем "ярлык" для сервиса MinIO (статические файлы и медиа)
    upstream minio_s3 {
        # Здесь 's3' — это DNS-имя или имя сервиса в docker-compose, порт 9000
        server s3:9000;
    }

    # Определяем "ярлык" для основного Django приложения (бэкенд)
    upstream backend {
        # 'backend' должен соответствовать имени контейнера или DNS-имени сервиса, порт 8000
        server backend:8000;
    }

    ######################################################################
    # Настройки виртуального сервера (виртуальный хост)
    ######################################################################
    
    server {
        # Слушаем порт 80 для HTTP
        listen 80;
        # Имя сервера (можно использовать для виртуального хостинга)
        server_name localhost;
        
        ##################################################################
        # Локация для основных запросов к приложению (backend)
        ##################################################################
        location / {
            # Все запросы, кроме явных /static/ или /media/, перенаправляются на бэкенд
            proxy_pass http://backend;
            # Передача оригинальных заголовков от клиента, чтобы бэкенд понимал, откуда пришёл запрос
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        ##################################################################
        # Локация для статики (файлы, собранные collectstatic)
        ##################################################################
        location /static/ {
            # Проксирование запросов к S3 через MinIO. Пусть файлы физически в бакете лежат по пути: django/static/
            proxy_pass http://minio_s3/django/static/;
            # Передача оригинальных заголовков
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Настройка кэширования на стороне nginx (опционально)
            expires 1d;
            add_header Cache-Control "public";
        }

        ##################################################################
        # Локация для медиа-файлов (загружаемых пользователями)
        ##################################################################
        location /media/ {
            # Проксирование запросов для медиа-файлов. Пусть файлы физически лежат в django/media/
            proxy_pass http://minio_s3/django/media/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Настройка кэширования медиа (если применимо)
            expires 1d;
            add_header Cache-Control "public";
        }
        
        ##################################################################
        # Дополнительные настройки / оптимизации
        ##################################################################
        
        # Логирование ошибок. Можно указать отдельный файл для ошибок:
        error_log /var/log/nginx/error.log warn;

        # В стандартном окружении можно включить access_log, чтобы отслеживать запросы:
        access_log /var/log/nginx/access.log;
    }
}
