services:
  backend:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile
    working_dir: /app/backend
    volumes:
      - ../../backend:/app/backend
      - ../../.env:/app/.env
    ports:
      - "8000:8000"
    env_file: ../../.env
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "backend.config.asgi:application"]