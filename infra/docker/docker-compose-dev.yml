services:
  backend:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile
    working_dir: /app/backend
    volumes:
      - ../../:/app
      - ../../.venv:/app/.venv
    ports:
      - "8000:8000"
    env_file: ../../.env
    command: ["uv", "run", "python", "manage.py", "runserver", "0.0.0.0:8000"]
