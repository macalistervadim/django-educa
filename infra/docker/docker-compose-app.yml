services:
  database:
    image: postgres:13-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: always
    env_file:
      - ../../.env

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  vault:
    image: vault:1.13.0
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    environment:
      VAULT_LOG_LEVEL: "info"
      VAULT_API_ADDR: "http://0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_LOCAL_CONFIG: '{
        "storage": {
          "file": {
            "path": "/vault/file"
          }
        },
        "listener": {
          "tcp": {
            "address": "0.0.0.0:8200",
            "tls_disable": true
          }
        },
        "disable_mlock": true,
        "ui": true,
        "audit": {
          "file": {
            "path": "/vault/logs/audit.log",
            "roll_size": "500MB",
            "roll_duration": "24h",
            "format": "json"
          }
        }
      }'
    volumes:
      - vault_data:/vault/file
      - vault_logs:/vault/logs
      - ../logs/vault:/vault/logs
    command: server
    restart: unless-stopped
    
  prometheus:
    image: prom/prometheus
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
  
  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
  
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.2
    volumes:
      - ../logstash/pipeline:/usr/share/logstash/pipeline
      - ../../backend/logs/backend:/logs
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.2
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
  
  s3:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio_data:/data
      - ../minio/cors.json:/tmp/cors.json
    entrypoint: /bin/sh -c
    command: >
      "/usr/bin/minio server /data --console-address ':9001' &&
      /usr/bin/minio anonymous set public django &&
      /usr/bin/minio policy set public django &&
      /usr/bin/minio admin config set myminio api cors=/tmp/cors.json"
      
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../logs/nginx:/var/log/nginx 
    depends_on:
      - s3
  
  rabbitmq:
    restart: always
    image: "rabbitmq:3-management"
    environment:
      RABBITMQ_DEFAULT_USER: "rabbitmq"
      RABBITMQ_DEFAULT_PASS: "rabbitmq"
      RABBITMQ_DEFAULT_VHOST: "/"
      RABBITMQ_DEFAULT_PERMISSIONS: ".* .* .*"
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    
  celery_worker:
    restart: always
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile
    working_dir: /app
    volumes:
      - ../../backend:/app/backend
    environment:
      DJANGO_SETTINGS_MODULE: "backend.config.settings.development"
      CELERY_BROKER_URL: "amqp://rabbitmq:rabbitmq@rabbitmq:5672/"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    command: celery -A backend.config.celery worker --loglevel=info -Q email -E --concurrency=4
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started

  flower:
    restart: always
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile
    working_dir: /app
    volumes:
      - ../../backend:/app/backend
    environment:
      DJANGO_SETTINGS_MODULE: "backend.config.settings.development"
      CELERY_BROKER_URL: "amqp://rabbitmq:rabbitmq@rabbitmq:5672/"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    ports:
      - "5556:5555"
    command: celery -A backend.config.celery flower --broker_api="http://rabbitmq:15672/api/" --address=0.0.0.0 --basic_auth=rabbitmq:rabbitmq --persistent=True
    depends_on:
      - celery_worker
      - rabbitmq
      
volumes:
  vault_data:
  vault_logs: 
  postgres_data:
  grafana_data:
  elasticsearch_data:
  logstash_data:
  minio_data: