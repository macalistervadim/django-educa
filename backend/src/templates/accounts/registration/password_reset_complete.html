{% extends 'base_landing.html' %}
{% block title %}Password Reset Complete{% endblock %}

{% block content %}
<section class="bg-gray-50 dark:bg-gray-800">
  <div class="flex flex-col items-center justify-center px-6 py-8 mx-auto md:h-screen lg:py-0">
      <div class="w-full max-w-md bg-white rounded-lg shadow dark:border md:mt-0 sm:max-w-md xl:p-0 dark:bg-gray-900 dark:border-gray-800">
          <div class="p-6 space-y-4 md:space-y-6 sm:p-8 text-center">
              <h1 class="text-xl font-bold leading-tight tracking-tight text-gray-900 md:text-2xl dark:text-white mb-4">
                  Password Reset Successful
              </h1>
              <p class="text-gray-600 dark:text-gray-400">Your password has been successfully reset. You can now log in with your new password.</p>
              <a href="{% url 'accounts:login' %}" class="w-full inline-block text-white bg-green-600 hover:bg-gray-700 focus:ring-4 focus:outline-none focus:ring-gray-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-green-600 dark:hover:bg-gray-700 dark:focus:ring-green-800 mt-4">
                  Go to Login
              </a>
          </div>
      </div>
  </div>
</section>
{% endblock %}
