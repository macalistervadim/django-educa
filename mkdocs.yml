site_name: Django Educa Docs
site_description: Documentation for Educa
site_author: macalistervadim

repo_url: https://github.com/macalistervadim/django-educa
repo_name: macalistervadim/django-educa
site_url: https://macalistervadim.github.io/django-educa/

languages:
  - en
  - ru

theme:
  name: material
  language: en
  i18n:
    default_language: en
    languages:
      en: English
      ru: Русский
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: dark theme
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: light theme

  features:
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - toc.integrate
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight

nav:
  - Home:
      - en: en/index.md
      - ru: ru/index.md
  - Installation:
      - en: en/installation.md
      - ru: ru/installation.md

markdown_extensions:
  - admonition
  - codehilite
  - footnotes
  - meta
  - toc:
      permalink: true

